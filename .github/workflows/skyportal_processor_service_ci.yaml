name: SkyPortal Processor Service CI/CD

on:
  push:
    branches: [ main ]
  pull_request:

env:
  # comment_watcher.py appends /remote.php/dav/files/{user}/{path} itself
  # (see its own default BASE_URL fallback, which is also bare) -- a
  # pre-suffixed value here doubles the path and 404s every OwnCloud
  # PROPFIND/GET it makes.
  OWNCLOUD_BASE_URL: "http://localhost:8080"
  OWNCLOUD_USERNAME: "admin"
  OWNCLOUD_TOKEN: "admin"
  OWNCLOUD_USER_ID: "admin"
  # Host path of the owncloud service's bind-mounted data dir (see
  # docker-compose.yaml) -- tests write fixture files here directly instead
  # of through OwnCloud's write API. Matches the default in
  # test_integration_comment_watcher.py; set explicitly for clarity.
  OWNCLOUD_DATA_PATH: "../data/owncloud"

  SAVE_PATH: "Candidates/Skyportal"
  STDWEB_SAVE_PATH: ""
  POLL_INTERVAL: "10"
  GROUP_IDS: "1,2,3"
  SOURCE_TAG: ""
  SKYPORTAL_COMMAND: "@rescan"
  # "TAROT Calern" is one of the fixed demo instruments make load_demo_data
  # seeds every time -- matches the TAROT-TCA folder the integration test
  # uploads its fixture FITS under.
  TELESCOPE_INSTRUMENT_MAP: '{"TAROT-TCA": "TAROT Calern"}'
  START_TIME: "2017-06-01T00:00:00Z"

  # Checked out (upstream, not a fork -- see the "Checkout StdWeb" step) and
  # built alongside grandma_tools.
  STDWEB_USERNAME: "stdweb-ci"
  STDWEB_PASSWORD: "stdweb-ci-password-not-used-in-prod"

jobs:
  integration-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Checkout SkyPortal
      uses: actions/checkout@v4
      with:
        repository: skyportal/skyportal
        path: skyportal
        submodules: recursive

    - name: Checkout StdWeb
      uses: actions/checkout@v4
      with:
        repository: karpov-sv/stdweb
        path: stdweb
        submodules: recursive

    - name: Prepare StdWeb Docker build files
      run: |
        # Upstream stdweb has no Dockerfile of its own -- see
        # skyportal_processor_service/stdweb-ci/README.md for why these are
        # grandma_tools' own files, copied in rather than living upstream.
        cp skyportal_processor_service/stdweb-ci/Dockerfile stdweb/Dockerfile
        cp skyportal_processor_service/stdweb-ci/docker-entrypoint.sh stdweb/docker-entrypoint.sh
        cp skyportal_processor_service/stdweb-ci/.dockerignore stdweb/.dockerignore

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Create SkyPortal test config
      run: |
        # docker.yaml (committed upstream) already has the right
        # container-to-container database.host/password for this compose
        # setup -- the Dockerfile copies it to config.yaml (`cp docker.yaml
        # config.yaml`) before `make system_setup` runs. Merging explicitly
        # here too removes any doubt rather than relying on that alone.
        pip install --break-system-packages --quiet pyyaml
        python3 -c "
        import yaml
        path = 'skyportal/docker.yaml'
        with open(path) as f:
            cfg = yaml.safe_load(f)
        cfg.setdefault('database', {})['host'] = 'db'
        cfg['database']['password'] = 'password'
        with open(path, 'w') as f:
            yaml.safe_dump(cfg, f)
        "
        echo "Updated docker.yaml:"
        cat skyportal/docker.yaml

    - name: Build SkyPortal Docker images
      run: |
        cd skyportal
        echo "Building SkyPortal Docker images..."
        make docker-local
        echo "SkyPortal images built successfully"

    - name: Start all services
      env:
        STDWEB_PATH: ../stdweb
      run: |
        # docker-compose.yaml's `web` depends on `db-init` (which creates
        # the schema) completing successfully, which itself depends on
        # `db`'s healthcheck -- `docker compose up` always waits out that
        # whole dependency chain before starting `web`, `-d` or not, so by
        # the time this step returns, `web` never raced an empty schema at
        # all (mirrors upstream skyportal's own docker-compose.yaml).
        cd skyportal_processor_service
        echo "Starting services..."
        docker compose up -d --build

    - name: Wait for StdWeb to be ready
      run: |
        echo "Waiting for StdWeb (redis+migrate+celery+runserver) to come up..."
        timeout 120 bash -c 'until curl -sf http://localhost:8000/login/ > /dev/null; do sleep 2; done'
        echo "StdWeb is up"

    - name: Wait for SkyPortal to be ready
      run: |
        # Supervisor starts ~39 services (migration check, 4 app workers,
        # nginx, rspack, ...) on container start, which can take a while.
        # load_demo_data needs the HTTP API and gives up after a fixed
        # number of retries (tools/data_loader.py), so without this wait it
        # can fail outright on a slow-to-start container rather than just
        # running late.
        echo "Waiting for SkyPortal (migration + app workers + nginx) to come up..."
        timeout 300 bash -c 'until curl -sf http://localhost:9000/api/sysinfo > /dev/null; do sleep 3; done'
        echo "SkyPortal is up"

    - name: Create StdWeb superuser and API token
      id: extract_stdweb_token
      run: |
        echo "Creating StdWeb superuser..."
        docker exec stdweb-web python manage.py shell -c "
        from django.contrib.auth import get_user_model
        User = get_user_model()
        if not User.objects.filter(username='${{ env.STDWEB_USERNAME }}').exists():
            User.objects.create_superuser('${{ env.STDWEB_USERNAME }}', 'ci@example.com', '${{ env.STDWEB_PASSWORD }}')
        "

        echo "Creating StdWeb API token..."
        docker exec stdweb-web python manage.py drf_create_token ${{ env.STDWEB_USERNAME }} > token_output.txt
        STDWEB_TOKEN=$(tail -1 token_output.txt | awk '{print $3}')

        if [ -z "$STDWEB_TOKEN" ]; then
          echo "Failed to extract StdWeb token"
          cat token_output.txt
          exit 1
        fi

        echo "STDWEB_TOKEN=$STDWEB_TOKEN" >> $GITHUB_OUTPUT

    - name: Load SkyPortal demo data
      run: |
        cd skyportal
        echo "Loading demo data..."
        docker exec skyportal-web bash -c 'source /skyportal/.venv/bin/activate && FLAGS="--create_tables --config=config.yaml" make load_demo_data'
        echo "Database initialized successfully"

    - name: Extract SkyPortal token
      id: extract_skyportal_token
      run: |
        cd skyportal
        echo "Extracting SkyPortal token..."
        SKYPORTAL_TOKEN=$(docker exec skyportal-web cat .tokens.yaml | grep "INITIAL_ADMIN:" | cut -d':' -f2 | tr -d ' ')

        if [ -z "$SKYPORTAL_TOKEN" ]; then
          echo "Failed to extract SkyPortal token"
          exit 1
        fi

        echo "SKYPORTAL_TOKEN=$SKYPORTAL_TOKEN" >> $GITHUB_OUTPUT

    - name: Create second SkyPortal user
      id: create_poster_user
      run: |
        # comment_watcher.py filters out comments authored by its own user id
        # (SELF_USER_ID), not by SkyPortal's bot flag -- every token-authenticated
        # request is bot=True regardless of which token (see
        # skyportal/handlers/api/comment.py), so triggering it needs a token
        # belonging to a genuinely different user. Plain API calls (POST
        # /api/user, then /api/internal/tokens for that user) replace what
        # previously needed a real Playwright browser session logged in via
        # SkyPortal's debug-login OAuth stand-in.
        SKYPORTAL_TOKEN="${{ steps.extract_skyportal_token.outputs.SKYPORTAL_TOKEN }}"

        USER_ID=$(curl -sf -X POST http://localhost:9000/api/user \
          -H "Authorization: token $SKYPORTAL_TOKEN" \
          -H "Content-Type: application/json" \
          -d '{"username": "ci-poster", "groupIDsAndAdmin": [[1, true]]}' \
          | python3 -c "import json,sys; print(json.load(sys.stdin)['data']['id'])")

        if [ -z "$USER_ID" ]; then
          echo "Failed to create second SkyPortal user"
          exit 1
        fi

        POSTER_TOKEN=$(curl -sf -X POST http://localhost:9000/api/internal/tokens \
          -H "Authorization: token $SKYPORTAL_TOKEN" \
          -H "Content-Type: application/json" \
          -d "{\"user_id\": $USER_ID, \"acls\": [\"Comment\"], \"name\": \"ci-poster-token\"}" \
          | python3 -c "import json,sys; print(json.load(sys.stdin)['data']['token_id'])")

        if [ -z "$POSTER_TOKEN" ]; then
          echo "Failed to create token for second SkyPortal user"
          exit 1
        fi

        echo "SKYPORTAL_POSTER_TOKEN=$POSTER_TOKEN" >> $GITHUB_OUTPUT

    - name: Create test environment file
      run: |
        cd skyportal_processor_service
        echo "Creating test environment file."
        cat > .env << EOF
        # OwnCloud Configuration
        OWNCLOUD_BASE_URL=${{ env.OWNCLOUD_BASE_URL }}
        OWNCLOUD_USERNAME=${{ env.OWNCLOUD_USERNAME }}
        OWNCLOUD_TOKEN=${{ env.OWNCLOUD_TOKEN }}
        OWNCLOUD_USER_ID=${{ env.OWNCLOUD_USER_ID }}
        OWNCLOUD_DATA_PATH=${{ env.OWNCLOUD_DATA_PATH }}

        # SkyPortal Configuration
        SKYPORTAL_URL=http://localhost:9000
        SKYPORTAL_TOKEN=${{ steps.extract_skyportal_token.outputs.SKYPORTAL_TOKEN }}
        SKYPORTAL_POSTER_TOKEN=${{ steps.create_poster_user.outputs.SKYPORTAL_POSTER_TOKEN }}

        # StdWeb Configuration
        STDWEB_URL=http://localhost:8000
        STDWEB_TOKEN=${{ steps.extract_stdweb_token.outputs.STDWEB_TOKEN }}

        # Application Settings
        SAVE_PATH=${{ env.SAVE_PATH }}
        STDWEB_SAVE_PATH=${{ env.STDWEB_SAVE_PATH }}
        POLL_INTERVAL=${{ env.POLL_INTERVAL }}
        GROUP_IDS=${{ env.GROUP_IDS }}
        SOURCE_TAG=${{ env.SOURCE_TAG }}
        SKYPORTAL_COMMAND=${{ env.SKYPORTAL_COMMAND }}
        START_TIME=${{ env.START_TIME }}
        EOF
        echo "Environment file created"

    - name: Install python dependencies
      run: |
        cd skyportal_processor_service
        echo "Installing comment watcher dependencies."
        # Runner's system Python is PEP 668 externally-managed; this is a
        # disposable CI runner, not a system to protect from pip.
        pip install --break-system-packages -r requirements.txt

    - name: Test comment watcher startup
      run: |
        cd skyportal_processor_service
        echo "Testing comment watcher startup (waiting for 'Listening for new sources...' or 60s timeout)..."

        python comment_watcher.py --env-file .env > watcher.log 2>&1 &
        WATCHER_PID=$!
        echo "WATCHER_PID=$WATCHER_PID" >> $GITHUB_ENV

        echo "Comment watcher started with PID: $WATCHER_PID"

        TIMEOUT=60
        ELAPSED=0
        SUCCESS=false

        while [ $ELAPSED -lt $TIMEOUT ]; do
          if ! kill -0 $WATCHER_PID 2>/dev/null; then
            echo "Comment watcher process has stopped unexpectedly"
            cat watcher.log
            exit 1
          fi

          if grep -q "Listening for new sources..." watcher.log 2>/dev/null; then
            echo "Comment watcher is listening"
            SUCCESS=true
            break
          fi

          if grep -q "ERROR" watcher.log; then
            echo "Error detected in comment watcher logs"
            cat watcher.log
            kill $WATCHER_PID 2>/dev/null || true
            exit 1
          fi

          sleep 2
          ELAPSED=$((ELAPSED + 2))
        done

        if [ "$SUCCESS" = false ]; then
          echo "Timeout reached (60s) without seeing 'Listening for new sources...' log"
          cat watcher.log
          kill $WATCHER_PID 2>/dev/null || true
          exit 1
        fi

        echo "Comment watcher startup test completed successfully -- leaving it running for the integration test"

    - name: Fix OwnCloud data directory permissions
      run: |
        # OwnCloud's container provisions its bind-mounted data directory
        # (docker-compose.yaml's ./data/owncloud) as its own internal
        # container user (uid 33/www-data), with directory permissions
        # (e.g. drwxrwx---) that exclude the runner's own user entirely.
        # seed_owncloud_file() in the integration test writes fixture
        # files directly into this tree from plain Python running as the
        # runner user (see its own docstring for why), so it needs write
        # access -- granted here rather than in docker-compose.yaml since
        # the restrictive permissions are OwnCloud's own default and come
        # from inside the container, not something compose config controls.
        sudo chmod -R a+rwX skyportal_processor_service/data/owncloud

    - name: Run comment watcher integration test
      run: |
        cd skyportal_processor_service/tests
        echo "Running pytest against the live comment watcher..."
        python -m pytest test_integration_comment_watcher.py -v -s
        echo "Integration test completed"

    - name: Stop comment watcher
      if: always()
      run: |
        kill $WATCHER_PID 2>/dev/null || true
        wait $WATCHER_PID 2>/dev/null || true

    - name: Show container logs
      if: always()
      run: |
        echo "Collecting container logs for debugging..."
        mkdir -p debug_logs

        docker logs owncloud_server > debug_logs/owncloud.log 2>&1 || echo "Failed to get owncloud logs" > debug_logs/owncloud.log
        docker logs skyportal-web > debug_logs/skyportal.log 2>&1 || echo "Failed to get skyportal logs" > debug_logs/skyportal.log
        docker logs postgres16 > debug_logs/postgres.log 2>&1 || echo "Failed to get postgres logs" > debug_logs/postgres.log
        docker logs stdweb-web > debug_logs/stdweb.log 2>&1 || echo "Failed to get stdweb logs" > debug_logs/stdweb.log
        docker ps -a > debug_logs/containers_status.txt 2>&1 || echo "Failed to get containers status" > debug_logs/containers_status.txt

        echo "Debug logs collected and will be saved to artifacts"

    - name: Save debug artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: debug-logs
        path: |
          debug_logs/
          skyportal_processor_service/watcher.log
        retention-days: 7

    - name: Cleanup
      if: always()
      run: |
        echo "Cleaning up services..."
        cd skyportal_processor_service && docker compose down -v || true
        echo "Cleanup completed"
